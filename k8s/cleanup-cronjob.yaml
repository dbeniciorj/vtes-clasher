# Runs daily at 03:00 UTC — deletes Flask DB records older than 365 days
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mycoe-cleanup
  namespace: mycoe
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: curlimages/curl:8.7.1
              env:
                - name: SERVICE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dashboard-auth
                      key: service-api-token
              command:
                - sh
                - -c
                - |
                  echo "Starting cleanup of records older than 365 days..."
                  curl -sf -X DELETE \
                    -H "X-API-Key: $SERVICE_API_TOKEN" \
                    "http://dashboard-service:5000/api/cleanup?days=365" \
                    -o /dev/null -w "HTTP %{http_code}\n" || exit 1
                  echo "Cleanup complete."
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"

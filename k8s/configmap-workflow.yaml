apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-workflow
  namespace: mycoe
data:
  demand-supply-lead-finder.json: |
    {
      "name": "CoE CV Scoring",
      "nodes": [
        {
          "parameters": {},
          "id": "node-manual-trigger",
          "name": "Manual Trigger",
          "type": "n8n-nodes-base.manualTrigger",
          "typeVersion": 1,
          "position": [200, 300]
        },
        {
          "parameters": {
            "httpMethod": "POST",
            "path": "mycoe-match",
            "responseMode": "onReceived",
            "responseData": "firstEntryJson",
            "options": {}
          },
          "id": "node-webhook-trigger",
          "name": "Dashboard Trigger",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [200, 460],
          "webhookId": "mycoe-match"
        },
        {
          "parameters": {
            "method": "POST",
            "url": "http://dashboard-service:5000/api/sync",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [{ "name": "X-API-Key", "value": "mycoe-service-token" }]
            },
            "options": {}
          },
          "id": "node-sync",
          "name": "Sync CVs and JDs",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [420, 300]
        },
        {
          "parameters": {
            "url": "http://dashboard-service:5000/api/pairs",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [{ "name": "X-API-Key", "value": "mycoe-service-token" }]
            },
            "options": {}
          },
          "id": "node-get-pairs",
          "name": "Get Unscored Pairs",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [640, 300]
        },
        {
          "parameters": {
            "jsCode": "const pairs = $input.first().json;\nif (!Array.isArray(pairs) || pairs.length === 0) {\n  return [];\n}\nreturn pairs.map(p => ({ json: p }));"
          },
          "id": "node-spread",
          "name": "Spread Pairs to Items",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [860, 300]
        },
        {
          "parameters": {
            "method": "POST",
            "url": "http://ollama-service:11434/api/generate",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [{ "name": "Content-Type", "value": "application/json" }]
            },
            "sendBody": true,
            "contentType": "raw",
            "rawContentType": "application/json",
            "body": "={{ JSON.stringify({\n  model: 'llama3',\n  prompt: `You are a senior recruiter. Score this candidate CV against the job requirements.\\n\\nCANDIDATE: ${$json.candidate.name}\\n\\nCV TEXT:\\n${$json.candidate.cv_text}\\n\\nJOB: ${$json.job.title}\\n\\nREQUIREMENTS (format: [weight=N] skill_name):\\n${$json.job.requirements_text}\\n\\nRespond ONLY with valid JSON, no markdown:\\n{\"score\": <integer 0-100>, \"rationale\": \"<2-3 sentence explanation>\"}`,\n  stream: false,\n  format: 'json'\n}) }}",
            "options": {}
          },
          "id": "node-score-cv",
          "name": "Score CV",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [1080, 300]
        },
        {
          "parameters": {
            "jsCode": "const item = $input.first().json;\nlet parsed = {};\ntry {\n  parsed = typeof item.response === 'string' ? JSON.parse(item.response) : item.response;\n} catch (e) {\n  parsed = { score: 0, rationale: 'Parse error: ' + String(e) };\n}\nconst inputItem = $('Spread Pairs to Items').item;\nreturn [{\n  json: {\n    candidate_id: inputItem.json.candidate.id,\n    job_id: inputItem.json.job.id,\n    score: parsed.score || 0,\n    rationale: parsed.rationale || ''\n  }\n}];"
          },
          "id": "node-parse-score",
          "name": "Parse Score",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [1300, 300]
        },
        {
          "parameters": {
            "conditions": {
              "options": { "caseSensitive": true, "leftValue": "", "typeValidation": "strict" },
              "conditions": [
                {
                  "leftValue": "={{ $json.score }}",
                  "rightValue": 80,
                  "operator": { "type": "number", "operation": "gte" }
                }
              ],
              "combinator": "and"
            }
          },
          "id": "node-if-score",
          "name": "Score >= 80?",
          "type": "n8n-nodes-base.if",
          "typeVersion": 2,
          "position": [1520, 300]
        },
        {
          "parameters": {
            "method": "POST",
            "url": "http://dashboard-service:5000/api/results",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                { "name": "Content-Type", "value": "application/json" },
                { "name": "X-API-Key", "value": "mycoe-service-token" }
              ]
            },
            "sendBody": true,
            "contentType": "raw",
            "rawContentType": "application/json",
            "body": "={{ JSON.stringify($json) }}",
            "options": {}
          },
          "id": "node-save-shortlisted",
          "name": "Save Shortlisted",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [1740, 200]
        },
        {
          "parameters": {
            "method": "POST",
            "url": "http://dashboard-service:5000/api/results",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                { "name": "Content-Type", "value": "application/json" },
                { "name": "X-API-Key", "value": "mycoe-service-token" }
              ]
            },
            "sendBody": true,
            "contentType": "raw",
            "rawContentType": "application/json",
            "body": "={{ JSON.stringify($json) }}",
            "options": {}
          },
          "id": "node-save-other",
          "name": "Save Other",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [1740, 400]
        }
      ],
      "connections": {
        "Manual Trigger": {
          "main": [[{ "node": "Sync CVs and JDs", "type": "main", "index": 0 }]]
        },
        "Dashboard Trigger": {
          "main": [[{ "node": "Sync CVs and JDs", "type": "main", "index": 0 }]]
        },
        "Sync CVs and JDs": {
          "main": [[{ "node": "Get Unscored Pairs", "type": "main", "index": 0 }]]
        },
        "Get Unscored Pairs": {
          "main": [[{ "node": "Spread Pairs to Items", "type": "main", "index": 0 }]]
        },
        "Spread Pairs to Items": {
          "main": [[{ "node": "Score CV", "type": "main", "index": 0 }]]
        },
        "Score CV": {
          "main": [[{ "node": "Parse Score", "type": "main", "index": 0 }]]
        },
        "Parse Score": {
          "main": [[{ "node": "Score >= 80?", "type": "main", "index": 0 }]]
        },
        "Score >= 80?": {
          "main": [
            [{ "node": "Save Shortlisted", "type": "main", "index": 0 }],
            [{ "node": "Save Other", "type": "main", "index": 0 }]
          ]
        }
      },
      "active": true,
      "settings": {
        "executionOrder": "v1",
        "saveManualExecutions": true,
        "callerPolicy": "workflowsFromSameOwner"
      },
      "versionId": "1",
      "id": "coe-cv-scoring-v1",
      "tags": [{ "name": "mycoe" }]
    }
